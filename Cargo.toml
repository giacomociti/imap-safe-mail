[package]
name = "imap-safe-mail"
version = "0.1.0"
edition = "2024"
description = "A safety-first mailbox API that supports trash and restore, never expunge."
license = "MIT"

[lib]
name = "imap_safe_mail"
path = "src/lib.rs"

[features]
# Only for the local GreenMail container, whose bundled TLS certificate is self-signed.
greenmail-tests = []

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
